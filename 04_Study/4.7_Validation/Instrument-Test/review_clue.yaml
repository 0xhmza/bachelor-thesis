# after comparing model and stand-in; the author must check every line.
# Own wording; evidence is located by unit, no quotes.

# A mention counts if the stand-in or at least two of three model runs returned it,
# unless it is rejected here.
rejected_mentions:
  - {unit: U129, node: K4, reason: "About a chat profile being separate; not re-identification of shared records."}
  - {unit: U131, node: K4, reason: "About what the user posts in the chat; not the data of the K4 pathway."}
  - {unit: U165, node: K4, reason: "A contract term between provider and analytics firm on linking IP addresses."}
  - {unit: U157, node: K6, reason: "Advice on erasing a lost phone; no one is said to read the data."}
