# Use cases of a health tracker, in the order in which their subtrees are built.
# Method: Knabenhans et al. 2026, s4 (one subtree per concrete use case, common sub-trees
# first, later use cases reuse the earlier trees); procedure of D23
# (00_Notes/Decisions/D23_use-case-subtrees.md).
# Read by 04_Study/4.3_Analytical-Framework/scripts/harm-tree-usecases/v001/build_usecases.py, together with
# reference_model_v2.yaml, which holds the definitions of components, capabilities and pathways.
#
# One card per use case. A card answers six fixed questions:
#   record   What does the app record about the person, from the user or from sensors?
#   derive   What does the app compute from the records?
#   phone    Who else can reach the records on the phone itself?
#   leaves   What leaves the phone, to whom, and under which condition?
#   asks     What does the app ask of the user, or deny the user?
#   outside  Which event outside the app does a pathway through this use case assume?
# Each answer maps to components of the model (existing ones are reused) and carries its
# evidence as "citation-key page". basis: documented = a source states it; argued = the
# study infers it. A component is new in the first card that names it; capabilities and
# pathways follow mechanically from the typed "needs" formulas of the model.
#
# role: build = the subtrees are built from the card; check = processed after the model stood,
# to test whether anything new turns up (stopping rule of D23).
version: 1
date: 2026-11-07
model: reference_model_v2.yaml

use_cases:
  - id: UC1
    role: build
    title: Logging and predicting on the phone
    function: >-
      The user logs cycle days, symptoms or other health data; the app shows history and
      predictions. Nothing leaves the phone.
    card:
      - {q: record, components: [CO1], basis: documented,
         answer: "Cycle, body and behaviour data entered by the user.",
         evidence: ["hudig2025intimate p. 3", "shipp2020period p. 11"]}
      - {q: derive, components: [CO2], basis: documented,
         answer: "Predictions of cycle regularity and fertility windows.",
         evidence: ["hudig2025intimate p. 3"]}
      - {q: record, components: [CO3], basis: argued,
         answer: "Predictions rest on a history that grows with every entry.",
         evidence: ["hudig2025intimate p. 3"]}
      - {q: phone, components: [CX1], basis: argued,
         answer: "Anyone who can open the phone can read the entries; abusive partners use trackers to stalk and threaten.",
         evidence: ["niksirat2024wearable p. 14"]}
      - {q: leaves, components: [], answer: "Nothing."}
      - {q: asks, components: [], answer: "Nothing."}
      - {q: outside, components: [], answer: "None."}

  - id: UC2
    role: build
    title: Account and a copy on the provider's servers
    function: >-
      The user registers an account; the records are stored or synchronised on the
      provider's servers, which may lie in another country.
    card:
      - {q: leaves, components: [IM1], basis: documented,
         answer: "An account ties a name or e-mail address to the records.",
         evidence: ["shipp2020period p. 6"]}
      - {q: leaves, components: [IM2], basis: documented,
         answer: "Records go to the provider's servers (14 of 30 menstrual apps; 15 of 19 policies name company servers).",
         evidence: ["shipp2020period p. 11", "malki2024exploring p. 8"]}
      - {q: leaves, components: [IM10], basis: documented,
         answer: "Data can be transferred and kept outside the user's country; endpoints lie in several countries.",
         evidence: ["malki2024exploring p. 9", "hudig2025intimate p. 1"]}
      - {q: outside, components: [EX1], basis: argued,
         answer: "Users fear that the provider's platform is hacked; the study assumes this for any stored data.",
         evidence: ["niksirat2024wearable p. 14"]}
      - {q: outside, components: [EX2], basis: documented,
         answer: "13 of 19 policies allow access by law enforcement on request or subpoena; users fear access by authorities.",
         evidence: ["malki2024exploring p. 8", "cao2024deleted p. 1"]}

  - id: UC3
    role: build
    title: Usage analytics and advertising
    function: >-
      The app embeds analytics, monitoring or advertising services that receive usage data
      and identifiers when it runs online.
    card:
      - {q: leaves, components: [IM3], basis: documented,
         answer: "Usage data goes to an analytics or monitoring service.",
         evidence: ["huckvale2019assessment p. 1", "malki2024exploring p. 7"]}
      - {q: leaves, components: [IM4], basis: documented,
         answer: "Identifiers or app events go to an advertising or attribution partner (29 of 36 apps sent data to Google and Facebook).",
         evidence: ["huckvale2019assessment p. 1", "shipp2020period p. 9"]}
      - {q: phone, components: [CX2], basis: documented,
         answer: "IP address and device data reach a server whenever the app is online.",
         evidence: ["malki2024exploring p. 7"]}
      - {q: phone, components: [CX3], basis: documented,
         answer: "A persistent device, push or advertising identifier exists and is read.",
         evidence: ["malki2024exploring p. 7"]}

  - id: UC4
    role: build
    title: Sharing with other people
    function: >-
      Records or profiles can be shared with a partner, family, friends or a community,
      or are visible in a feed.
    card:
      - {q: leaves, components: [IM9], basis: documented,
         answer: "Data is shared with partners (for example in pregnancy plans), friends, family and strangers; caregivers monitor children.",
         evidence: ["hudig2025intimate p. 3", "niksirat2024wearable p. 8"]}
      - {q: outside, components: [EX3], basis: documented,
         answer: "Insurers and employers are named as parties that could obtain the data.",
         evidence: ["hudig2025intimate p. 3", "niksirat2024wearable p. 12"]}

  - id: UC5
    role: build
    title: Recording routes and places
    function: >-
      The app records GPS positions or routes of runs, walks or rides.
    card:
      - {q: record, components: [IM8], basis: documented,
         answer: "GPS coordinates and routes; locations can be inferred, and users rate location the most sensitive data (burglary, bike theft).",
         evidence: ["niksirat2024wearable p. 12", "niksirat2024wearable p. 14", "gabriele2020understanding p. 1"]}

  - id: UC6
    role: build
    title: Processors, research partners and commercial use
    function: >-
      Tracked data reaches processors that run the service, research or other partners as
      de-identified records, and commercial uses such as offers and partner products.
    card:
      - {q: leaves, components: [IM5], basis: documented,
         answer: "Support, messaging, AI or hosting processors receive tracked health data; 17 of 19 policies name third-party servers.",
         evidence: ["malki2024exploring p. 3", "malki2024exploring p. 8"]}
      - {q: leaves, components: [IM6], basis: documented,
         answer: "De-identified records go to research and development or to partners; users can be offered opt-ins for research.",
         evidence: ["malki2024exploring p. 8", "hudig2025intimate p. 5"]}
      - {q: leaves, components: [IM7], basis: documented,
         answer: "Data is shared with advertisers or sold; profiles drive tailored offers.",
         evidence: ["hudig2025intimate p. 2", "shipp2020period p. 9"]}

  - id: UC7
    role: build
    title: "Terms of use: consent, deletion, export and opt-out"
    function: >-
      The user must accept the provider's terms, wants to leave, and tries to delete or
      take out the data or to stop a flow.
    card:
      - {q: asks, components: [IM11], basis: documented,
         answer: "Refusing the terms often meant that the user could not use the service; users face a forced choice.",
         evidence: ["malki2024exploring p. 9", "malki2024exploring p. 10", "niksirat2024wearable p. 14"]}
      - {q: asks, components: [IM12], basis: documented,
         answer: "Only a third of the apps offered deletion in the app; one did not tell the server to delete backups.",
         evidence: ["shipp2020period p. 9", "malki2024exploring p. 3"]}
      - {q: asks, components: [IM14], basis: documented,
         answer: "Portability of the data is rare.",
         evidence: ["shipp2020period p. 9", "malki2024exploring p. 2"]}
      - {q: asks, components: [IM13], basis: documented,
         answer: "Users lack meaningful ways to opt out of practices while using the app.",
         evidence: ["malki2024exploring p. 3", "niksirat2024wearable p. 14"]}

  # Check cases: the card is filled from the sources only; every answer is then mapped.
  # The role is "check" because the model already stood: they show that the card questions
  # leave no answer unmapped, they are not an independent test of the model.
  - id: UC8
    role: check
    title: Diet and weight logging
    function: >-
      The user logs meals, calories and weight; the app derives intake and progress.
    card:
      - {q: record, components: [CO1, CO3], basis: documented,
         answer: "Nutrition, weight and activity are tracked; eating and drinking can be inferred.",
         evidence: ["gabriele2020understanding p. 1", "niksirat2024wearable p. 12"]}
      - {q: derive, components: [CO2], basis: documented,
         answer: "Progress and weight-loss insights.",
         evidence: ["niksirat2024wearable p. 6"]}
      - {q: leaves, components: [IM1, IM2, IM3, IM4, IM7, IM9], basis: argued,
         answer: "Account, server copy, analytics, advertising, commercial use and sharing in a community: the flows of UC2 to UC6.",
         evidence: ["niksirat2024wearable p. 8", "huckvale2019assessment p. 1"]}
      - {q: phone, components: [CX1, CX2, CX3], basis: argued,
         answer: "Same phone and network conditions as UC1 and UC3.",
         evidence: ["malki2024exploring p. 7"]}

  - id: UC9
    role: check
    title: Mood and cessation tracking
    function: >-
      The user logs mood, symptoms or smoking events; a chat or coaching feature may answer.
    card:
      - {q: record, components: [CO1, CO3], basis: documented,
         answer: "Mood, symptoms and cessation data.",
         evidence: ["huckvale2019assessment p. 1"]}
      - {q: derive, components: [CO2], basis: argued,
         answer: "Scores or feedback computed from the entries.",
         evidence: ["huckvale2019assessment p. 1"]}
      - {q: leaves, components: [IM2, IM3, IM4, IM5, IM7], basis: documented,
         answer: "Data goes to the developer's servers and to analytics and advertising services (transmission to a third party in 33 of 36 apps); chat transcripts of mental-health apps were mined for marketing.",
         evidence: ["huckvale2019assessment p. 1", "malki2024exploring p. 3"]}

  - id: UC10
    role: check
    title: Sleep and heart rate synced from a wearable
    function: >-
      A companion app receives sleep, heart-rate and activity records from a wearable and
      shows them. The analysis of the wearable itself is outside the study.
    card:
      - {q: record, components: [CO1, CO3], basis: documented,
         answer: "Sensor records of sleep, heart rate and steps arrive in the app.",
         evidence: ["niksirat2024wearable p. 6", "gabriele2020understanding p. 1"]}
      - {q: leaves, components: [IM2, IM3, IM4, IM9], basis: argued,
         answer: "The app side follows UC2 to UC4.",
         evidence: ["niksirat2024wearable p. 8"]}
      - {q: phone, components: [CX1], basis: argued,
         answer: "Same as UC1.",
         evidence: ["niksirat2024wearable p. 14"]}
    out_of_scope:
      - {item: "Inference of keystrokes or PINs from the motion sensors of the watch (K3)",
         reason: "needs the analysis of the connected device, which the study excludes."}
